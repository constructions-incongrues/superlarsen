# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/6b3a2a93e77c30ded1aa8264307e74d1208a6eae/schema/compose-spec.json
services:
  wordpress:
    image: wordpress:7.1.5-php8.3-apache@sha256:2e5145737f46b8fd53f333a05eb3a4f21321c90e20475b7827082dd5f75b62b0
    restart: always
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-exampleuser}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-examplepass}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-exampledb}
    volumes:
      - /mnt/superlarsen/wordpress/wp:/var/www/html
      - ./mu-plugins/superlarsen-anonymat-comptes.php:/var/www/html/wp-content/mu-plugins/superlarsen-anonymat-comptes.php:ro
    networks:
      - caddy
      - default
    labels:
      caddy: www.superlarsen.fr
      caddy.reverse_proxy: "{{upstreams 80}}"
      # www passe par Cloudflare (défi sur wp-login.php) : l'origine refuse ce qui n'en vient
      # pas, sinon le défi se contourne en visant 37.27.5.164.
      # ponytail: plages copiées de cloudflare.com/ips-v4 et ips-v6 le 2026-11-21 ; elles
      # changent rarement, à relire à chaque relevé. Un 403 sur le site public les signale.
      caddy.@hors_cloudflare.not: "remote_ip 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32"
      caddy.respond: "@hors_cloudflare 403"
      stack-back.volumes: true

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-exampledb}
      MYSQL_USER: ${MYSQL_USER:-exampleuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-examplepass}
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - /mnt/superlarsen/wordpress/db:/var/lib/mysql
    labels:
      stack-back.mysql: true

  backup:
    image: ghcr.io/lawndoc/stack-back:v1.4.5
    env_file: .env
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./cache:/cache

networks:
  caddy:
    external: true
  smtp:
    external: true
