# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/6b3a2a93e77c30ded1aa8264307e74d1208a6eae/schema/compose-spec.json
services:
  app:
    image: castopod/castopod:1.15.7@sha256:9479cd65c4c933bb151838c8da784d284742d56b2fa74ce2cf0be4168f1dc6f0
    volumes:
      - /mnt/superlarsen/castopod/media:/app/public/media
    networks:
      - castopod-app
      - castopod-db
      - caddy
    restart: unless-stopped
    env_file: .env
    labels:
      caddy: castopod.superlarsen.fr
      caddy.reverse_proxy: "{{upstreams 8080}}"
      stack-back.volumes: true

  mariadb:
    image: mariadb:13.0
    networks:
      - castopod-db
    volumes:
      - /mnt/superlarsen/castopod/db:/var/lib/mysql
    labels:
      stack-back.mariadb: true
    restart: unless-stopped
    env_file: .env

  redis:
    image: redis:7.2.17-alpine
    command: --requirepass changeme
    env_file: .env
    volumes:
      - /mnt/superlarsen/castopod/cache:/data
    networks:
      - castopod-app
    restart: unless-stopped

  backup:
    image: ghcr.io/lawndoc/stack-back:v1.4.5
    env_file: .env
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./cache:/cache
    networks:
      - castopod-db

networks:
  castopod-app:
  castopod-db:
  caddy:
    external: true
  smtp:
    external: true
