# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/6b3a2a93e77c30ded1aa8264307e74d1208a6eae/schema/compose-spec.json
services:
  sftp:
    image: atmoz/sftp:alpine
    restart: always
    ports:
      - "2222:22"
    volumes:
      - ./users.conf:/etc/sftp/users.conf:ro
      - ./keys/trivoallan.pub:/home/wordpress/.ssh/keys/trivoallan.pub:ro
      - /mnt/superlarsen/wordpress/wp:/home/wordpress/superlarsen.fr
