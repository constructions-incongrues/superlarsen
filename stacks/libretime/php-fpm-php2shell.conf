; PHP2Shell (CVE-2026-109618, CVE-2026-109619): unauthenticated RCE in the
; PHP engine. libretime-legacy 4.5.0 ships PHP 7.4, which gets no released
; fix. These are the PHP team's exposure-reducing workarounds, not a fix.
; Remove this file once LibreTime ships a release on a patched PHP.
;
; post_max_size is deliberately NOT lowered: shows uploaded here reach
; 347 MB (257 files above 32 MB as of 2026-11-10).
[www]
php_admin_flag[session.upload_progress.enabled] = off
; The bugs are reached through PHP's own out-of-memory path. -1 removes it;
; the container's mem_limit bounds memory instead.
php_admin_value[memory_limit] = -1
