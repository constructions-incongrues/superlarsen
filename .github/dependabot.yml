# Mises à jour proposées par Dependabot (ADR-0018). Les écosystèmes suivent
# les fichiers suivis (règle 5). Délai de 3 jours après publication (règle 2).
version: 2
updates:
  - package-ecosystem: docker-compose
    directories:
      - /stacks/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: terraform
    directory: /infrastructure/terraform
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
