# Analyse du code du dépôt par checkov, résultats envoyés en SARIF à GitHub
# (ADR-0024 : code_scanning.tool: checkov, fail_on: low — tout constat bloque).
name: scan

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: scan-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checkov:
    name: checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      security-events: write # envoi du SARIF à code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bridgecrewio/checkov-action@3f0caf0c3aa9f56ade6b49f6e60b63aaeafb75a3 # v12.3141.0
        with:
          directory: .
          framework: terraform,github_actions
          skip_path: node_modules
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: checkov.sarif
          category: checkov
