# Audit des workflows par zizmor sur chaque pull request (ADR-0011, forge.audit: zizmor).
# Un constat ne se fait taire qu'en ligne, avec sa raison : # zizmor: ignore[<audit>] <raison>
name: audit

on:
  pull_request:

permissions: {}

concurrency:
  group: audit-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false
          annotations: true
