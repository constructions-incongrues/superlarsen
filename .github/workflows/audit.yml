# Audit des workflows par zizmor sur chaque pull request (ADR-0011, forge.audit: zizmor).
# Un constat ne se fait taire qu'en ligne, avec sa raison : # zizmor: ignore[<audit>] <raison>
name: audit

on:
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: audit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.8
          install_args: zizmor
        env:
          MISE_LOCKED: 1
      # zizmor vient de mise.lock (ADR-0025) ; ses audits en ligne lisent GH_TOKEN.
      - run: zizmor --format=github .
        env:
          GH_TOKEN: ${{ github.token }}
