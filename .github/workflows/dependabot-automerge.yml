# Met en file les mises à jour de patch proposées par Dependabot (ADR-0018,
# automerge: patch). Jamais les actions GitHub ni une version majeure ou mineure.
# La merge queue ne merge qu'une fois les checks requis verts (ADR-0001 local).
name: dependabot-automerge

on:
  pull_request:

permissions: {}

jobs:
  automerge:
    name: automerge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # mise en file du merge
      pull-requests: write # activation de l'auto-merge
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.update-type == 'version-update:semver-patch' && steps.meta.outputs.package-ecosystem != 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
