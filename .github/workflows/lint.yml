# Lint des changements, requis sur main (ADR-0011, forge.gate: blocking).
# La commande vient de .trunk/trunk.yaml : `trunk check` sur les fichiers modifiés.
name: lint

on:
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  trunk:
    name: trunk check
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      checks: write # annotations de Trunk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.8
          install_args: node npm:@trunkio/launcher
        env:
          MISE_LOCKED: 1
      # Le lanceur Trunk vient de mise.lock (ADR-0025) ; Trunk épingle ensuite
      # son CLI et ses linters dans .trunk/trunk.yaml.
      - id: launcher
        run: echo "path=$(mise which trunk)" >> "$GITHUB_OUTPUT"
      - uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
        # Sur merge_group, trunk-action choisit le mode « none » et n'analyse rien :
        # on le force en mode push, sur le diff entre main et le commit du groupe.
        with:
          trunk-path: ${{ steps.launcher.outputs.path }}
          check-mode: ${{ github.event_name == 'merge_group' && 'push' || '' }}
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.merge_group.base_sha }}
          GITHUB_EVENT_AFTER: ${{ github.event.merge_group.head_sha }}
